<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="seccion">
        <form class="formulario">
            <label class="titulo">Name:</label>
            <input class="contenido"  type="text" placeholder="Nombre">
            <label class="titulo" >Email:</label>
            <input class="contenido"  type="text" placeholder="Email">
            <label class="titulo" >Message:</label>
            <textarea class="contenido" placeholder="Contenido del email"></textarea>
            <button class="boton">Enviar</button>
        </form>
    </section>
</body>
</html>
